spring:
  application:
    name: pequi-short
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/${APP_DB_DATABASE}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.flywaydb: DEBUG

jwt:
  secret: ${APP_ACCESS_TOKEN_HASH}
  expiration: ${APP_ACCESS_TOKEN_EXPIRATION}
  refresh_secret: ${APP_REFRESH_TOKEN_HASH}
  refresh_expiration: ${APP_REFRESH_TOKEN_EXPIRATION}

host:
  name: http://localhost:8080